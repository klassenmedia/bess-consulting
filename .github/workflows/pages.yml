name: Vorschau auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein Deploy gleichzeitig, laufende nicht abbrechen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit
        run: npm audit --audit-level=high

      - name: Build für Unterpfad
        env:
          # Vorschau bleibt bewusst auf noindex: PUBLIC_INDEXABLE wird nicht gesetzt.
          PUBLIC_BASE: /${{ github.event.repository.name }}/
          PUBLIC_SITE: https://${{ github.repository_owner }}.github.io
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
